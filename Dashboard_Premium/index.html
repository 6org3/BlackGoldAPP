    <!-- Las fuentes (Outfit + Silkscreen) se auto-hospedan vía @fontsource y se
         importan desde src/index.css. Antes venían de fonts.googleapis.com con
         un handler inline (onload="this.media='all'") para no bloquear el primer
         render: eso filtraba la IP de cada atleta y cada padre a un tercero, y
         el handler era el único obstáculo para una CSP con script-src 'self'.
         Servidas desde el mismo origen no hay round-trip externo que esperar,
         así que la carga diferida deja de hacer falta. -->
